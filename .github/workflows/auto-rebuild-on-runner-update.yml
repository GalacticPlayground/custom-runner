name: Weekly Runner Rebuild

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log scheduled rebuild
        run: |
          echo "Weekly scheduled rebuild triggered"
          echo "Triggering rebuild of custom runner image"

      - name: Trigger build workflow
        run: |
          gh workflow run build-and-push.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create notification
        run: |
          echo "::notice::Triggered custom runner rebuild on weekly schedule"
